services:

    nginx:
        image: nginx:latest
        ports:
        - "80:80"
        volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
        - frontend1
        - frontend2
        - frontend3
    server:
        build:
            context: .
            dockerfile: Dockerfile.backend
        env_file:
            - .env
        ports:
            - "8000:8000"
            - "8001:8001/udp"
            - "8001:8001/tcp"
    frontend1:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        env_file:
            - frontend/.env
        environment:
            - INSTANCE_NAME=frontend-1
        ports:
            - "3000:3000"
    frontend2:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        env_file:
            - frontend/.env
        environment:
            - INSTANCE_NAME=frontend-2
        ports:
            - "3001:3000"

    frontend3:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        env_file:
            - frontend/.env
        environment:
            - INSTANCE_NAME=frontend-3
        ports:
            - "3002:3000"
volumes:
    db_data: