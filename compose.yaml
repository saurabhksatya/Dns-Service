services:
    db:
        image: postgres:18
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 10s
            timeout: 5s
            retries: 5
    
volumes:
    db_data: