events {}

http {
    access_log off;
    error_log /dev/stderr error;

    upstream nextjs {
        server frontend1:3000;
        server frontend2:3000;
        server frontend3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://nextjs;

            proxy_next_upstream off;
        }
    }
}